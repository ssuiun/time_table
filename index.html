<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Class Schedule</title>
<style>
  :root{
    color-scheme:light;
    --bg:#F5F6F8;
    --surface:#FFFFFF;
    --field:#F5F6F8;
    --ink:#1C1E21;
    --on-ink:#FFFFFF;
    --ink-soft:#6B7280;
    --border:#E6E8EC;
    --scrim:rgba(20,20,25,0.4);
    --danger-bg:#FCEAEA;
    --danger:#C0392B;
    --now:#E24C4C;
    --focus:#4C7EA8;
    --radius:16px;
    --shadow:0 1px 2px rgba(20,20,30,0.04), 0 4px 14px rgba(20,20,30,0.06);
    --fab-shadow:0 8px 20px rgba(0,0,0,0.22);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]):not([data-mode="light"]){
      color-scheme:dark;
      --bg:#11151A;
      --surface:#1A2028;
      --field:#11151A;
      --ink:#E8EBEF;
      --on-ink:#11151A;
      --ink-soft:#9AA3AF;
      --border:#2A323C;
      --scrim:rgba(0,0,0,0.62);
      --danger-bg:#3A2226;
      --danger:#F19A90;
      --now:#FF6B6B;
      --focus:#7FB0DA;
      --shadow:0 1px 2px rgba(0,0,0,0.35), 0 4px 14px rgba(0,0,0,0.3);
      --fab-shadow:0 8px 20px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"]:not([data-mode="light"]),
  :root[data-mode="dark"]{
    color-scheme:dark;
    --bg:#11151A;
    --surface:#1A2028;
    --field:#11151A;
    --ink:#E8EBEF;
    --on-ink:#11151A;
    --ink-soft:#9AA3AF;
    --border:#2A323C;
    --scrim:rgba(0,0,0,0.62);
    --danger-bg:#3A2226;
    --danger:#F19A90;
    --now:#FF6B6B;
    --focus:#7FB0DA;
    --shadow:0 1px 2px rgba(0,0,0,0.35), 0 4px 14px rgba(0,0,0,0.3);
    --fab-shadow:0 8px 20px rgba(0,0,0,0.5);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  [hidden]{display:none !important;}
  html,body{min-height:100%;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:14px;
    background:var(--bg);
    color:var(--ink);
    overscroll-behavior-y:none;
  }
  :focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
  button{font-family:inherit;}
  #app{
    max-width:520px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    padding-bottom:calc(90px + env(safe-area-inset-bottom, 0px));
  }

  /* header */
  header{
    padding:18px 18px 8px;
    position:sticky; top:env(safe-area-inset-top, 0px); z-index:20;
    background:var(--bg);
  }
  .title-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  h1{font-size:22px; font-weight:700; margin:0; letter-spacing:-0.01em;}
  .subtitle{font-size:13px; color:var(--ink-soft); margin-top:2px; display:flex; flex-wrap:wrap; column-gap:8px;}
  .sync{white-space:nowrap;}
  .sync.error{color:var(--danger);}
  .head-actions{display:flex; align-items:center; gap:8px;}
  .icon-btn{
    width:40px; height:40px; border-radius:12px; border:1px solid var(--border);
    background:var(--surface); color:var(--ink); display:flex; align-items:center; justify-content:center;
    cursor:pointer; padding:0;
  }
  .icon-btn svg{width:20px; height:20px; display:block;}
  .view-toggle{
    display:flex; background:var(--surface); border:1px solid var(--border);
    border-radius:12px; padding:3px; gap:2px;
  }
  .view-toggle button{
    border:none; background:transparent; padding:7px 12px; border-radius:9px;
    font-size:13px; font-weight:600; color:var(--ink-soft); cursor:pointer;
  }
  .view-toggle button.active{background:var(--ink); color:var(--on-ink);}

  /* day tabs */
  .day-tabs{
    display:flex; gap:6px; overflow-x:auto; padding:14px 18px 4px;
    scrollbar-width:none;
  }
  .day-tabs::-webkit-scrollbar{display:none;}
  .day-tab{
    flex:0 0 auto; padding:9px 14px; border-radius:12px; border:1px solid var(--border);
    background:var(--surface); font-size:13px; font-weight:600; color:var(--ink-soft);
    cursor:pointer; white-space:nowrap; position:relative;
  }
  .day-tab.active{background:var(--ink); color:var(--on-ink); border-color:var(--ink);}
  .day-tab .dot{
    position:absolute; top:-3px; right:-3px; width:7px; height:7px; border-radius:50%;
    background:#E08A4C; display:none;
  }
  .day-tab.today .dot{display:block;}

  main{flex:1; padding:6px 18px 12px;}

  /* list view */
  .class-card{
    display:flex; gap:12px; background:var(--surface); border-radius:var(--radius);
    box-shadow:var(--shadow); margin-bottom:12px; padding:14px 16px 14px 0; cursor:pointer;
    overflow:hidden; border:1px solid var(--border);
    animation:rise .25s ease;
  }
  @keyframes rise{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:translateY(0)}}
  .class-card .bar{width:5px; flex:0 0 5px; border-radius:4px;}
  .class-card .body{flex:1; min-width:0; padding-left:12px;}
  .class-time{font-size:13px; font-weight:700; color:var(--ink-soft); letter-spacing:0.01em;}
  .class-name{font-size:16px; font-weight:700; margin:3px 0 2px; line-height:1.25; overflow-wrap:anywhere;}
  .class-room{font-size:13px; color:var(--ink-soft);}
  .class-note{
    display:flex; gap:7px; align-items:flex-start; margin-top:10px; padding:8px 10px;
    background:var(--field); border-radius:10px; font-size:13px; line-height:1.4; color:var(--ink);
  }
  .class-note svg{flex:0 0 13px; margin-top:2px; color:var(--ink-soft);}
  .class-note span{
    white-space:pre-wrap; overflow-wrap:anywhere; min-width:0;
    display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden;
  }

  .empty-state{text-align:center; padding:60px 20px; color:var(--ink-soft);}
  .empty-state .emoji{font-size:34px; margin-bottom:10px;}
  .empty-state b{color:var(--ink); display:block; margin-bottom:4px; font-size:15px;}

  /* week grid view */
  .week-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  .week-grid{display:flex; min-width:max-content; position:relative;}
  .week-col-times{flex:0 0 44px; padding-top:34px;}
  .time-slot{height:56px; font-size:10px; color:var(--ink-soft); text-align:right; padding-right:6px; transform:translateY(-6px);}
  .week-col{flex:0 0 96px; border-left:1px solid var(--border); position:relative;}
  .week-col-header{
    height:34px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size:11px; font-weight:700; color:var(--ink-soft); position:sticky; top:0;
  }
  .week-col-header.today{color:#E08A4C;}
  .week-col-body{position:relative; background:linear-gradient(var(--border) 1px, transparent 1px); background-size:100% 56px;}
  .wblock{
    position:absolute; left:3px; right:3px; border-radius:8px; padding:5px 6px; color:#fff;
    font-size:10px; font-weight:600; overflow:hidden; cursor:pointer; line-height:1.25;
  }
  .wblock.has-note::after{
    content:""; position:absolute; top:5px; right:5px; width:6px; height:6px; border-radius:50%;
    background:#fff; opacity:.9;
  }
  .now-line{position:absolute; left:0; right:0; height:2px; background:var(--now); z-index:5;}
  .now-line::before{content:""; position:absolute; left:-3px; top:-3px; width:8px; height:8px; border-radius:50%; background:var(--now);}

  /* fab */
  .fab{
    position:fixed; right:calc(50% - 260px + 22px); bottom:calc(24px + env(safe-area-inset-bottom, 0px));
    width:56px; height:56px; border-radius:50%; background:var(--ink); color:var(--on-ink);
    display:flex; align-items:center; justify-content:center; font-size:26px; border:none;
    box-shadow:var(--fab-shadow); cursor:pointer; z-index:30;
  }
  @media (max-width:560px){ .fab{right:22px;} }

  /* toast */
  .toast{
    position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom, 0px));
    transform:translate(-50%, 8px); background:var(--ink); color:var(--on-ink);
    padding:9px 14px; border-radius:12px; font-size:13px; font-weight:600;
    opacity:0; pointer-events:none; transition:opacity .18s ease, transform .18s ease; z-index:60;
    max-width:calc(100% - 32px); text-align:center;
  }
  .toast.show{opacity:1; transform:translate(-50%, 0);}

  /* sheet */
  .backdrop{
    position:fixed; inset:0; background:var(--scrim); z-index:40; opacity:0;
    pointer-events:none; transition:opacity .2s ease;
  }
  .backdrop.show{opacity:1; pointer-events:auto;}
  .sheet{
    position:fixed; left:0; right:0; bottom:0; background:var(--surface); z-index:50;
    border-radius:20px 20px 0 0; padding:18px 18px calc(20px + env(safe-area-inset-bottom, 0px));
    max-width:520px; margin:0 auto; transform:translateY(105%); transition:transform .28s cubic-bezier(.32,.72,0,1);
    max-height:88vh; overflow-y:auto; visibility:hidden;
    border:1px solid var(--border); border-bottom:none;
    transition:transform .28s cubic-bezier(.32,.72,0,1), visibility 0s linear .28s;
  }
  .sheet.show{transform:translateY(0); visibility:visible; transition:transform .28s cubic-bezier(.32,.72,0,1), visibility 0s;}
  .sheet-handle{width:36px; height:4px; background:var(--border); border-radius:3px; margin:0 auto 14px;}
  .sheet h2{font-size:18px; margin:0 0 16px;}
  .field{margin-bottom:14px;}
  .field label{font-size:12px; font-weight:700; color:var(--ink-soft); display:block; margin-bottom:6px; text-transform:uppercase; letter-spacing:0.03em;}
  .field input[type=text], .field textarea{
    width:100%; border:1px solid var(--border); border-radius:10px; padding:11px 12px; font-size:15px;
    background:var(--field); color:var(--ink); font-family:inherit;
  }
  .field textarea{resize:vertical; min-height:96px; line-height:1.4;}
  .field input::placeholder, .field textarea::placeholder{color:var(--ink-soft); opacity:.7;}
  .row2{display:flex; gap:10px;}
  .row2 .field{flex:1; min-width:0;}
  select.period-select{
    flex:1; min-width:0; border:1px solid var(--border); border-radius:10px; padding:11px 10px; font-size:13px;
    background:var(--field); color:var(--ink); appearance:none; -webkit-appearance:none;
  }
  input[type=time]{
    width:100%; border:1px solid var(--border); border-radius:10px; padding:10px 12px; font-size:15px;
    background:var(--field); color:var(--ink); font-family:inherit;
  }
  .days-picker{display:flex; gap:6px; flex-wrap:wrap;}
  .chip{
    padding:8px 12px; border-radius:10px; border:1px solid var(--border); background:var(--field);
    font-size:13px; font-weight:600; color:var(--ink-soft); cursor:pointer;
  }
  .chip.on{background:var(--ink); color:var(--on-ink); border-color:var(--ink);}
  .swatches{display:flex; gap:10px; flex-wrap:wrap;}
  .swatch{width:32px; height:32px; border-radius:50%; cursor:pointer; border:3px solid transparent;}
  .swatch.on{border-color:var(--ink);}
  .sheet-actions{display:flex; gap:10px; margin-top:18px;}
  .btn{flex:1; border:none; border-radius:12px; padding:13px; font-size:15px; font-weight:700; cursor:pointer;}
  .btn-primary{background:var(--ink); color:var(--on-ink);}
  .btn-ghost{background:var(--field); color:var(--ink-soft);}
  .btn-danger{background:var(--danger-bg); color:var(--danger); flex:0 0 auto; padding:13px 16px;}
  .btn.nudge{animation:nudge .45s ease;}
  @keyframes nudge{0%,100%{transform:translateX(0)} 20%{transform:translateX(-5px)} 40%{transform:translateX(5px)} 60%{transform:translateX(-3px)} 80%{transform:translateX(3px)}}

  @media (prefers-reduced-motion: reduce){
    .class-card, .btn.nudge{animation:none;}
    .sheet, .backdrop, .toast{transition:none;}
  }
</style>

<script>
  // Apply the saved theme choice before first paint (auto = follow the device / viewer theme).
  (function(){
    try{
      var m = localStorage.getItem('schedule:theme');
      if(m === 'light' || m === 'dark') document.documentElement.setAttribute('data-mode', m);
    }catch(e){}
  })();
</script>

</head>
<body>
<div id="app">
  <header>
    <div class="title-row">
      <div>
        <h1>Schedule</h1>
        <div class="subtitle"><span id="subDate">—</span><span id="sync" class="sync"></span></div>
      </div>
      <div class="head-actions">
        <button class="icon-btn" id="btnTheme" type="button" aria-label="Theme: auto. Tap to change."></button>
        <div class="view-toggle">
          <button id="btnList" class="active" type="button">List</button>
          <button id="btnWeek" type="button">Week</button>
        </div>
      </div>
    </div>
  </header>

  <div id="dayTabs" class="day-tabs"></div>

  <main id="main">
    <div class="empty-state">Loading schedule…</div>
  </main>
</div>

<button class="fab" id="fabAdd" type="button" aria-label="Add class">+</button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-handle"></div>
  <h2 id="sheetTitle">New class</h2>
  <div class="field">
    <label for="fName">Subject</label>
    <input type="text" id="fName" placeholder="e.g. Economics">
  </div>
  <div class="field">
    <label for="fRoom">Room / building</label>
    <input type="text" id="fRoom" placeholder="e.g. Mingzhi Building A305">
  </div>
  <div class="field">
    <label for="fNotes">Notes</label>
    <textarea id="fNotes" rows="4" placeholder="Homework, what to bring, reminders…"></textarea>
  </div>
  <div class="field">
    <label for="fPeriodStart">Class periods</label>
    <div class="row2">
      <select id="fPeriodStart" class="period-select" aria-label="From period"></select>
      <select id="fPeriodEnd" class="period-select" aria-label="To period"></select>
    </div>
  </div>
  <div class="row2">
    <div class="field">
      <label for="fStart">Start</label>
      <input type="time" id="fStart" value="09:00">
    </div>
    <div class="field">
      <label for="fEnd">End</label>
      <input type="time" id="fEnd" value="10:30">
    </div>
  </div>
  <div class="field">
    <label>Days of week</label>
    <div class="days-picker" id="daysPicker"></div>
  </div>
  <div class="field">
    <label>Color</label>
    <div class="swatches" id="swatches"></div>
  </div>
  <div class="sheet-actions">
    <button class="btn btn-danger" id="btnDelete" type="button" hidden>Delete</button>
    <button class="btn btn-ghost" id="btnCancel" type="button">Cancel</button>
    <button class="btn btn-primary" id="btnSave" type="button">Save</button>
  </div>
</div>

<script>
(function(){
  const DAY_NAMES = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const DAY_FULL = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  const COLORS = [
    {key:'amber', hex:'#D9A441'},
    {key:'blue', hex:'#4C7EA8'},
    {key:'orange', hex:'#E08A4C'},
    {key:'teal', hex:'#3FA5A0'},
    {key:'green', hex:'#4C9A6A'},
    {key:'purple', hex:'#8A6FBF'},
  ];
  const DATA_KEY = 'schedule:classes:v4';
  const THEME_KEY = 'schedule:theme';
  const DATA_VERSION = 4;
  const PERIODS = [
    {n:1, start:'08:00', end:'08:45'},
    {n:2, start:'08:50', end:'09:35'},
    {n:3, start:'09:50', end:'10:35'},
    {n:4, start:'10:40', end:'11:25'},
    {n:5, start:'11:30', end:'12:15'},
    {n:6, start:'14:30', end:'15:15'},
    {n:7, start:'15:20', end:'16:05'},
    {n:8, start:'16:20', end:'17:05'},
    {n:9, start:'17:10', end:'17:55'},
    {n:10, start:'19:00', end:'19:45'},
    {n:11, start:'19:50', end:'20:35'},
  ];
  const NOTE_ICON = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
  const THEME_ICONS = {
    auto:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none"/></svg>',
    light:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    dark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
  };
  const THEME_LABELS = {auto:'Auto (follows your device)', light:'Light', dark:'Dark'};

  const todayIdx = (new Date().getDay() + 6) % 7; // Monday = 0
  let selectedDay = todayIdx;
  let view = 'list';
  let classes = [];
  let lastUpdated = 0;      // ms timestamp of the last local/remote change; newest copy wins
  let editingId = null;
  let selectedDays = new Set();
  let selectedColor = COLORS[0].key;
  let initialFormState = '';
  let ref = null;           // db document, when the db capability is available
  let localOk = true;       // is this browser's storage usable?

  const $ = (id) => document.getElementById(id);
  function uid(){ return 'c' + Math.random().toString(36).slice(2,10); }
  function colorHex(key){ const c = COLORS.find(c=>c.key===key); return c ? c.hex : COLORS[0].hex; }
  function timeToMin(t){ const [h,m] = t.split(':').map(Number); return h*60+m; }
  function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

  function defaultClasses(){
    return [
      {id:uid(), name:'Elementary Chinese Reading and Writing (2001)', room:'Mingzhi Building A305', notes:'', start:'08:00', end:'09:35', days:[0], color:'amber'},
      {id:uid(), name:'Elementary Chinese Reading and Writing (2001)', room:'Mingzhi Building A305', notes:'', start:'14:30', end:'16:05', days:[2], color:'amber'},
      {id:uid(), name:'Microeconomics (2001)', room:'Mingzhi Building A309', notes:'', start:'09:50', end:'11:25', days:[0,2], color:'blue'},
      {id:uid(), name:'Management (2001)', room:'Mingzhi Building A305', notes:'', start:'08:00', end:'09:35', days:[2], color:'green'},
      {id:uid(), name:'Management (2001)', room:'Mingzhi Building A305', notes:'', start:'14:30', end:'16:05', days:[4], color:'green'},
      {id:uid(), name:'Overview of China (2001)', room:'Mingli Building B103', notes:'', start:'09:50', end:'11:25', days:[3], color:'orange'},
      {id:uid(), name:'Overview of China (2001)', room:'Mingli Building B103', notes:'', start:'16:20', end:'17:55', days:[1], color:'orange'},
      {id:uid(), name:'Chinese Language 3 (2002)', room:'Mingzhi Building A305', notes:'', start:'09:50', end:'11:25', days:[4], color:'teal'},
      {id:uid(), name:'Chinese Language 3 (2002)', room:'Mingzhi Building A305', notes:'', start:'16:20', end:'17:55', days:[0], color:'teal'},
    ];
  }

  // Clean up anything read from storage so a bad record can never break rendering.
  function normalize(list){
    return (Array.isArray(list) ? list : []).map(c => ({
      id: (c && c.id) ? String(c.id) : uid(),
      name: String((c && c.name) || ''),
      room: String((c && c.room) || ''),
      notes: String((c && c.notes) || ''),
      start: (c && /^\d{1,2}:\d{2}$/.test(c.start)) ? c.start : '09:00',
      end: (c && /^\d{1,2}:\d{2}$/.test(c.end)) ? c.end : '10:30',
      days: Array.isArray(c && c.days) ? c.days.filter(d => Number.isInteger(d) && d >= 0 && d <= 6) : [],
      color: COLORS.some(x => x.key === (c && c.color)) ? c.color : COLORS[0].key,
    }));
  }

  // ---- saving: this device (localStorage) + the artifact database when available ----
  function serialize(){ return {version:DATA_VERSION, updatedAt:lastUpdated, classes}; }

  function lsRead(){
    try{
      const raw = localStorage.getItem(DATA_KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }
  function lsWrite(obj){
    try{ localStorage.setItem(DATA_KEY, JSON.stringify(obj)); localOk = true; }
    catch(e){ localOk = false; }
  }

  function setSync(state){
    const el = $('sync');
    const map = {
      saving:['Saving…', ''],
      saved:['Saved', ''],
      local:[localOk ? 'Saved on this device' : 'Not saved: storage is blocked', localOk ? '' : 'error'],
      error:['Not synced, kept on this device', 'error'],
      '':['', ''],
    };
    const [text, cls] = map[state] || map[''];
    el.textContent = text;
    el.className = 'sync' + (cls ? ' ' + cls : '');
  }

  let writing = false, writeAgain = false;
  async function pushRemote(){
    if(!ref) return;
    writeAgain = true;
    if(writing) return;
    writing = true;
    setSync('saving');
    try{
      while(writeAgain){
        writeAgain = false;
        await ref.set(serialize());
      }
      setSync('saved');
    }catch(e){
      console.error('Sync error', e);
      setSync('error');
    }finally{
      writing = false;
    }
  }

  function persist(){
    lastUpdated = Date.now();
    lsWrite(serialize());
    if(ref) pushRemote(); else setSync('local');
  }

  function onRemote(snap){
    if(snap.metadata && snap.metadata.hasPendingWrites) return;
    const d = snap.exists ? snap.data() : null;
    if(d && Array.isArray(d.classes)){
      const remoteTime = Number(d.updatedAt) || 0;
      if(remoteTime > lastUpdated){
        classes = normalize(JSON.parse(JSON.stringify(d.classes)));
        lastUpdated = remoteTime;
        lsWrite(serialize());
        renderMain();
        setSync('saved');
        return;
      }
      if(remoteTime === lastUpdated){ setSync('saved'); return; }
    }
    // Nothing stored yet, or this device has newer edits: send them up.
    if(lastUpdated > 0) pushRemote(); else setSync('saved');
  }

  async function connectDb(){
    try{
      if(!window.claude || typeof window.claude.use !== 'function'){ setSync('local'); return; }
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      const id = (db && user) ? await user.id() : null;
      if(!db || !id){ setSync('local'); return; }
      ref = db.doc('data/users/' + id + '/schedule');
      ref.onSnapshot(onRemote, () => { ref = null; setSync('local'); });
    }catch(e){
      ref = null;
      setSync('local');
    }
  }

  // ---- theme ----
  let mode = 'auto';
  try{ const m = localStorage.getItem(THEME_KEY); if(m === 'light' || m === 'dark') mode = m; }catch(e){}

  function applyMode(){
    const root = document.documentElement;
    if(mode === 'auto') root.removeAttribute('data-mode'); else root.setAttribute('data-mode', mode);
    const btn = $('btnTheme');
    btn.innerHTML = THEME_ICONS[mode];
    btn.setAttribute('aria-label', 'Theme: ' + THEME_LABELS[mode] + '. Tap to change.');
    btn.title = 'Theme: ' + THEME_LABELS[mode];
  }
  let toastTimer = null;
  function toast(msg){
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1400);
  }
  function cycleMode(){
    mode = mode === 'auto' ? 'light' : mode === 'light' ? 'dark' : 'auto';
    try{ localStorage.setItem(THEME_KEY, mode); }catch(e){}
    applyMode();
    toast('Theme: ' + THEME_LABELS[mode]);
  }

  // ---- rendering ----
  function renderSubtitle(){
    const now = new Date();
    $('subDate').textContent = DAY_FULL[todayIdx] + ', ' + now.toLocaleDateString('en-US', {day:'numeric', month:'long'});
  }

  function renderDayTabs(){
    const wrap = $('dayTabs');
    wrap.innerHTML = '';
    DAY_NAMES.forEach((label, i) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'day-tab' + (i===selectedDay?' active':'') + (i===todayIdx?' today':'');
      btn.innerHTML = label + '<span class="dot"></span>';
      btn.onclick = () => { selectedDay = i; renderDayTabs(); renderMain(); };
      wrap.appendChild(btn);
    });
  }

  function renderList(){
    const main = $('main');
    const dayClasses = classes.filter(c => c.days.includes(selectedDay))
                              .sort((a,b) => timeToMin(a.start) - timeToMin(b.start));
    if(dayClasses.length === 0){
      main.innerHTML = '<div class="empty-state"><div class="emoji">🗓️</div><b>No classes</b>Tap + to add a class for this day.</div>';
      return;
    }
    main.innerHTML = '';
    dayClasses.forEach(c => {
      const note = (c.notes || '').trim();
      const card = document.createElement('div');
      card.className = 'class-card';
      card.tabIndex = 0;
      card.setAttribute('role', 'button');
      card.innerHTML = `
        <div class="bar" style="background:${colorHex(c.color)}"></div>
        <div class="body">
          <div class="class-time">${c.start} – ${c.end}</div>
          <div class="class-name">${escapeHtml(c.name)}</div>
          <div class="class-room">${escapeHtml(c.room || '')}</div>
          ${note ? `<div class="class-note">${NOTE_ICON}<span>${escapeHtml(note)}</span></div>` : ''}
        </div>`;
      card.onclick = () => openSheet(c);
      card.onkeydown = (e) => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openSheet(c); } };
      main.appendChild(card);
    });
  }

  function renderWeek(){
    const main = $('main');
    const startHour = 7, endHour = 21;
    const pxPerHour = 56;
    let timesHtml = '';
    for(let h=startHour; h<=endHour; h++){
      timesHtml += `<div class="time-slot">${String(h).padStart(2,'0')}:00</div>`;
    }
    let colsHtml = '';
    DAY_NAMES.forEach((label, i) => {
      const blocks = classes.filter(c => c.days.includes(i));
      let blocksHtml = '';
      blocks.forEach(c => {
        const top = (timeToMin(c.start) - startHour*60) / 60 * pxPerHour;
        const height = Math.max(26, (timeToMin(c.end) - timeToMin(c.start)) / 60 * pxPerHour - 4);
        const hasNote = (c.notes || '').trim() ? ' has-note' : '';
        blocksHtml += `<div class="wblock${hasNote}" data-id="${escapeHtml(c.id)}" style="top:${top}px; height:${height}px; background:${colorHex(c.color)}">${escapeHtml(c.name)}</div>`;
      });
      let nowLine = '';
      if(i === todayIdx){
        const now = new Date();
        const nowMin = now.getHours()*60 + now.getMinutes();
        if(nowMin >= startHour*60 && nowMin <= endHour*60){
          const top = (nowMin - startHour*60)/60*pxPerHour;
          nowLine = `<div class="now-line" style="top:${top}px"></div>`;
        }
      }
      colsHtml += `<div class="week-col">
        <div class="week-col-header${i===todayIdx?' today':''}">${label}</div>
        <div class="week-col-body" style="height:${(endHour-startHour+1)*pxPerHour}px">${blocksHtml}${nowLine}</div>
      </div>`;
    });
    main.innerHTML = `<div class="week-scroll"><div class="week-grid">
      <div class="week-col-times">${timesHtml}</div>
      ${colsHtml}
    </div></div>`;
    main.querySelectorAll('.wblock').forEach(el => {
      el.onclick = () => {
        const c = classes.find(x => x.id === el.dataset.id);
        if(c) openSheet(c);
      };
    });
  }

  function renderMain(){ if(view === 'list') renderList(); else renderWeek(); }

  // ---- sheet (add/edit) ----
  function populatePeriodSelects(){
    const ps = $('fPeriodStart'), pe = $('fPeriodEnd');
    const opts = PERIODS.map(p => `<option value="${p.n}">Period ${p.n} (${p.start})</option>`).join('');
    ps.innerHTML = '<option value="">From period…</option>' + opts;
    pe.innerHTML = '<option value="">To period…</option>' + opts;
    ps.onchange = () => {
      const p = PERIODS.find(x => x.n === Number(ps.value));
      if(p) $('fStart').value = p.start;
    };
    pe.onchange = () => {
      const p = PERIODS.find(x => x.n === Number(pe.value));
      if(p) $('fEnd').value = p.end;
    };
  }

  function syncPeriodSelectsFromTimes(){
    const startP = PERIODS.find(p => p.start === $('fStart').value);
    const endP = PERIODS.find(p => p.end === $('fEnd').value);
    $('fPeriodStart').value = startP ? startP.n : '';
    $('fPeriodEnd').value = endP ? endP.n : '';
  }

  function buildPickers(){
    const dp = $('daysPicker');
    dp.innerHTML = '';
    DAY_NAMES.forEach((label,i) => {
      const chip = document.createElement('div');
      chip.className = 'chip';
      chip.textContent = label;
      chip.onclick = () => {
        if(selectedDays.has(i)) selectedDays.delete(i); else selectedDays.add(i);
        chip.classList.toggle('on');
      };
      chip.dataset.day = i;
      dp.appendChild(chip);
    });
    const sw = $('swatches');
    sw.innerHTML = '';
    COLORS.forEach(c => {
      const s = document.createElement('div');
      s.className = 'swatch';
      s.style.background = c.hex;
      s.onclick = () => {
        selectedColor = c.key;
        sw.querySelectorAll('.swatch').forEach(x=>x.classList.remove('on'));
        s.classList.add('on');
      };
      s.dataset.key = c.key;
      sw.appendChild(s);
    });
  }

  function formState(){
    return JSON.stringify([$('fName').value, $('fRoom').value, $('fNotes').value, $('fStart').value, $('fEnd').value, Array.from(selectedDays).sort(), selectedColor]);
  }

  let deleteArmed = false, deleteTimer = null;
  function resetDeleteBtn(){
    deleteArmed = false;
    clearTimeout(deleteTimer);
    $('btnDelete').textContent = 'Delete';
  }

  function openSheet(existing){
    editingId = existing ? existing.id : null;
    $('sheetTitle').textContent = existing ? 'Edit class' : 'New class';
    $('btnDelete').hidden = !existing;
    resetDeleteBtn();
    $('fName').value = existing ? existing.name : '';
    $('fRoom').value = existing ? existing.room : '';
    $('fNotes').value = existing ? (existing.notes || '') : '';
    $('fStart').value = existing ? existing.start : '09:00';
    $('fEnd').value = existing ? existing.end : '10:30';
    selectedDays = new Set(existing ? existing.days : [selectedDay]);
    selectedColor = existing ? existing.color : COLORS[0].key;
    buildPickers();
    populatePeriodSelects();
    syncPeriodSelectsFromTimes();
    document.querySelectorAll('#daysPicker .chip').forEach(chip => {
      if(selectedDays.has(Number(chip.dataset.day))) chip.classList.add('on');
    });
    document.querySelectorAll('#swatches .swatch').forEach(s => {
      if(s.dataset.key === selectedColor) s.classList.add('on');
    });
    initialFormState = formState();
    $('sheet').scrollTop = 0;
    $('backdrop').classList.add('show');
    $('sheet').classList.add('show');
  }

  function closeSheet(){
    $('backdrop').classList.remove('show');
    $('sheet').classList.remove('show');
    resetDeleteBtn();
  }

  // Tapping outside closes the sheet, unless there are unsaved edits (so notes are never lost by accident).
  function tryDismiss(){
    if(formState() !== initialFormState){
      const b = $('btnSave');
      b.classList.remove('nudge');
      void b.offsetWidth;
      b.classList.add('nudge');
      return;
    }
    closeSheet();
  }

  function saveClass(){
    const name = $('fName').value.trim();
    if(!name){ $('fName').focus(); return; }
    const start = $('fStart').value || '09:00';
    const end = $('fEnd').value || '10:30';
    const room = $('fRoom').value.trim();
    const notes = $('fNotes').value.trim();
    const days = Array.from(selectedDays).sort();
    if(days.length === 0) days.push(selectedDay);

    const existing = editingId ? classes.find(x => x.id === editingId) : null;
    if(existing){
      Object.assign(existing, {name, room, notes, start, end, days, color:selectedColor});
    } else {
      classes.push({id:uid(), name, room, notes, start, end, days, color:selectedColor});
    }
    persist();
    closeSheet();
    renderMain();
  }

  function deleteClass(){
    if(!deleteArmed){
      deleteArmed = true;
      $('btnDelete').textContent = 'Tap again';
      clearTimeout(deleteTimer);
      deleteTimer = setTimeout(resetDeleteBtn, 3000);
      return;
    }
    classes = classes.filter(c => c.id !== editingId);
    persist();
    closeSheet();
    renderMain();
  }

  // ---- wiring ----
  $('fabAdd').onclick = () => openSheet(null);
  $('backdrop').onclick = tryDismiss;
  $('btnCancel').onclick = closeSheet;
  $('btnSave').onclick = saveClass;
  $('btnDelete').onclick = deleteClass;
  $('btnTheme').onclick = cycleMode;
  $('fStart').onchange = syncPeriodSelectsFromTimes;
  $('fEnd').onchange = syncPeriodSelectsFromTimes;
  $('btnList').onclick = () => { view='list'; $('btnList').classList.add('active'); $('btnWeek').classList.remove('active'); renderMain(); };
  $('btnWeek').onclick = () => { view='week'; $('btnWeek').classList.add('active'); $('btnList').classList.remove('active'); renderMain(); };
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape' && $('sheet').classList.contains('show')) tryDismiss();
  });

  // ---- start ----
  applyMode();
  renderSubtitle();
  renderDayTabs();
  const saved = lsRead();
  if(saved && Array.isArray(saved.classes)){
    classes = normalize(saved.classes);
    lastUpdated = Number(saved.updatedAt) || 0;
  } else {
    classes = defaultClasses();
  }
  renderMain();
  connectDb();
})();
</script>

</body>
</html>
